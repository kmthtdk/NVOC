# ============================================================================
# Nginx config for the N-VOC SPA container.
#  - Serves the static Vite build.
#  - SPA fallback so client-side routing works on deep links / refresh.
#  - Reverse-proxies /api/ -> backend service (same-origin, no CORS in browser).
# ============================================================================

upstream voc_backend {
    # "backend" is the compose service name; resolved on the docker network.
    server backend:4000;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling — must be >= backend MAX_UPLOAD_BYTES (10MB).
    client_max_body_size 12m;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- API + health: proxy to the backend ----
    location /api/ {
        proxy_pass         http://voc_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Expose the backend health endpoint through the proxy for convenience.
    location = /health {
        proxy_pass       http://voc_backend/health;
        proxy_set_header Host $host;
    }

    # ---- Static assets: long cache for fingerprinted files ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback: serve index.html for any unmatched route ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
